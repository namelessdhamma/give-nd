name: Ksyusha source qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-static-and-target-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit full transfer source and build 23 target bundles
        run: python3 scripts/verify_transfer.py

      - name: Exercise installed Human Output 1.7.8 clean-build and executable policy
        run: python3 scripts/test_human_output_install.py

      - name: Stage U cumulative 31/22 to 32/23 read-only installer plan and source safeguards
        run: python3 scripts/test_stage_u.py
